name: Build GodPotatoBOF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 and make
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Patch Makefile to include stub.c
        run: |
          sed -i 's|COMMON_SRCS := $(wildcard common/\*.c)|COMMON_SRCS := $(wildcard common/*.c) common/stub.c|' Makefile
          echo "=== Makefile COMMON_SRCS ==="
          grep COMMON_SRCS Makefile

      - name: Ensure boflink is executable
        run: chmod +x boflink

      - name: Build BOF
        run: make

      - name: List output
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodPotatoBOF
          path: dist/*.o
