name: Build GodPotatoBOF

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make gcc

      - name: Verify mingw-w64
        run: x86_64-w64-mingw32-gcc --version

      - name: Show repository structure
        run: |
          ls -la
          ls -la common

      - name: Build BOF
        run: make

      - name: List build artifacts
        run: ls -la

      - name: Upload BOF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GodPotatoBOF
          path: |
            *.o
            *.cna
            common/*.o
            common/*.cna
          if-no-files-found: warn
